<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computer Troubleshooting Quiz</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#3b2a28;--mut:#7a6d6a;--ac:#5a9e8a;--acbg:#d8ece6;--ok:#2e7d5b;--okbg:#dff3e8;--bad:#b3392f;--badbg:#f9e0dc;--bd:#e3ddd5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#292422;--tx:#f1ebe6;--mut:#a89f9a;--ac:#6fb8a3;--acbg:#2f4640;--ok:#6fd3a0;--okbg:#22372d;--bad:#ff8f84;--badbg:#472825;--bd:#3d3532;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
.tag{font-size:13px;color:var(--mut)}
h1{font-size:22px;margin:4px 0 8px}h2{font-size:19px;margin:6px 0 16px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
button{font:inherit;color:inherit}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{margin:12px 0;padding:12px;border-radius:12px;background:var(--acbg);font-size:15px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:600}
.btn.alt{background:transparent;color:var(--tx);border:1.5px solid var(--bd);margin-left:8px}
.score{font-size:44px;font-weight:700;margin:8px 0}
#qr{display:flex;justify-content:center;background:#fff;padding:16px;border-radius:12px;margin:12px 0}
.hide{display:none}
</style>
</head>
<body>
<main>
<div class="card" id="app"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const Q=[
{t:"Method",q:"What is the first step in troubleshooting?",o:["Replace the most likely part","Observe the symptom","Reinstall the system"],a:1,f:"Diagnose first. Observe what happens, try the simplest safe check, then change one thing and test."},
{t:"Power",q:"The computer will not turn on. What should you check first?",o:["The outlet and the cable","The motherboard","The hard drive"],a:0,f:"Start with the outlet and cable, and inspect the charger from the outside only."},
{t:"Power",q:"You notice damage or a burning smell from the charger. What now?",o:["Keep testing carefully","Stop and ask a technician","Try a different charger of any type"],a:1,f:"A possible hazard means stop and ask a technician. Only use a charger that matches the device."},
{t:"Display",q:"The computer is on but the monitor says “No Signal”. What do you check?",o:["The video cable and monitor input","The keyboard","The Wi-Fi"],a:0,f:"Check monitor power, the video cable, and select the correct monitor input (e.g. HDMI)."},
{t:"Performance",q:"The computer is slow. What is the best approach?",o:["Buy more RAM right away","Check resource use (CPU, memory, disk)","Delete random files"],a:1,f:"Use evidence, not guesses. Save your work, close unused apps, and consider upgrades only after diagnosis."},
{t:"Network",q:"Connected to Wi-Fi but websites will not load. What is a good next test?",o:["Factory reset the router","Test another device on the network","Reinstall the OS"],a:1,f:"Wi-Fi is not the same as internet access. Check whether one device or every device is affected."},
{t:"Devices",q:"A mouse or keyboard stops working. What do you try first?",o:["Another USB port, then batteries or power","Reinstall Windows","Replace the computer"],a:0,f:"Isolate the cause: connection, power, driver. Get drivers from the manufacturer or Windows Update."},
{t:"Software",q:"An application crashes with an error. What should you do first?",o:["Save work and note the error message","Ignore it and restart repeatedly","Delete system files"],a:0,f:"Note the error, review updates and recent changes, then use system tools like SFC (which checks system files but does not fix every fault)."}
];
let i=0,s=0,done=false;const app=document.getElementById("app");
function start(){i=0;s=0;show()}
function show(){
 if(i>=Q.length){return end()}
 const x=Q[i];
 app.innerHTML=`<div class="tag">Question ${i+1} of ${Q.length} · ${x.t}</div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><h2>${x.q}</h2><div id="o"></div><div id="fb"></div>`;
 const o=document.getElementById("o");
 x.o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(k);o.appendChild(b)});
}
function pick(k){
 const x=Q[i],bs=document.querySelectorAll(".opt");
 bs.forEach((b,j)=>{b.disabled=true;if(j===x.a)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
 if(k===x.a)s++;
 document.getElementById("fb").innerHTML=`<div class="fb">${k===x.a?"✅ Correct. ":"❌ Not quite. "}${x.f}</div><button class="btn" id="n">${i+1<Q.length?"Next":"See score"}</button>`;
 document.getElementById("n").onclick=()=>{i++;show()};
}
function end(){
 const m=s>=7?"Excellent work!":s>=5?"Good job, review the missed ones.":"Rewatch the video and try again.";
 app.innerHTML=`<h1>Your score</h1><div class="score">${s} / ${Q.length}</div><p>${m}</p><button class="btn" id="r">Try again</button><button class="btn alt" id="q">Show QR code</button>`;
 document.getElementById("r").onclick=start;document.getElementById("q").onclick=qr;
}
function qr(){
 app.innerHTML=`<h1>Scan to open the quiz</h1><div id="qr"></div><p class="tag">Point a phone camera at this code.</p><button class="btn" id="b">Back</button>`;
 try{new QRCode(document.getElementById("qr"),{text:location.href.split("#")[0],width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}catch(e){document.getElementById("qr").textContent="QR unavailable"}
 document.getElementById("b").onclick=intro;
}
function intro(){
 app.innerHTML=`<div class="tag">Based on the video</div><h1>Computer Troubleshooting Quiz</h1><p>8 quick questions on diagnosing common computer problems.</p><button class="btn" id="s">Start</button><button class="btn alt" id="q">QR code</button>`;
 document.getElementById("s").onclick=start;document.getElementById("q").onclick=qr;
}
if(location.hash==="#qr")qr();else intro();
</script>
</body>
</html>
